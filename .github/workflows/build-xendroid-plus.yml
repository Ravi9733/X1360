name: Build X1360 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x1360-android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Xendroid+ arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.3
      BUILD_TOOLS_VERSION: 35.0.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout X1360 build wrapper
        uses: actions/checkout@v4

      - name: Checkout pinned Xendroid+ source
        uses: actions/checkout@v4
        with:
          repository: phforner0/Xendroid-Plus
          ref: 9a84d065f68520d60d4e3b32ec407dec5b04dd62
          path: xendroid-plus
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ninja-build python3 glslang-tools spirv-tools ccache

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "cmake;3.30.3"
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$ANDROID_HOME/cmake/$CMAKE_VERSION"
          test -d "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          test -d "$ANDROID_HOME/platforms/android-35"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "cmake.dir=$ANDROID_HOME/cmake/$CMAKE_VERSION"
          } > xendroid-plus/local.properties

      - name: Build debug APK
        working-directory: xendroid-plus
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --build-cache --parallel \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:assembleDebug

      - name: Check APK exists
        run: |
          set -eu
          ls -lh xendroid-plus/app/build/outputs/apk/debug/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: X1360-XendroidPlus-Android-APK
          path: xendroid-plus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
